{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ book.title }}{% endblock %}
{% block content %}
<article class="chapter">
  <header class="chapter-head">
    <h1 class="chapter-title">{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ page.body_html | safe }}
  </div>
</article>
{% endblock %}
