[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guidebook"
dynamic = ["version"]
description = "Build a textbook-style static site from Markdown chapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alkaid Cheng", email = "alkaidc@stanford.edu" }]
keywords = ["documentation", "markdown", "static-site", "textbook", "mathjax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = ["Jinja2", "Pygments", "PyYAML", "pyromark"]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest",
    "ruff",
    "types-Pygments",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/AlkaidCheng/guidebook"
Repository = "https://github.com/AlkaidCheng/guidebook"
Issues = "https://github.com/AlkaidCheng/guidebook/issues"

[project.scripts]
guidebook = "guidebook.cli:main"

[tool.hatch.version]
path = "src/guidebook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/guidebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is owned by Black; E501 on strings, comments and URLs is noise.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/guidebook"]
# types-Pygments leaves HtmlFormatter.get_style_defs without annotations.
untyped_calls_exclude = ["pygments"]
