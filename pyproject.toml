[build-system]
# 1.9.3 is the first to copy license-files into a source distribution:
# https://github.com/PyO3/maturin/blob/main/Changelog.md
requires = ["maturin>=1.9.3"]
build-backend = "maturin"

[project]
name = "bookspine"
version = "0.1.0"
description = "Build a textbook-style static site from Markdown chapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Alkaid Cheng", email = "alkaidc@stanford.edu" }]
keywords = ["documentation", "markdown", "static-site", "textbook", "mathjax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = ["Jinja2", "Pygments", "PyYAML"]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest",
    "ruff",
    "types-Pygments",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/AlkaidCheng/bookspine"
Repository = "https://github.com/AlkaidCheng/bookspine"
Issues = "https://github.com/AlkaidCheng/bookspine/issues"

[project.scripts]
bookspine = "bookspine.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "bookspine._markdown"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is owned by Black; E501 on strings, comments and URLs is noise.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bookspine"]
# types-Pygments leaves HtmlFormatter.get_style_defs without annotations.
untyped_calls_exclude = ["pygments"]
